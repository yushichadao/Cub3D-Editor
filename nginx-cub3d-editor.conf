# Cub3D Editor 站点 Nginx 配置
# 站点根目录：/www/wwwroot/139.196.104.56/
# 用途：IP 直访 → 301 重定向到域名；域名 → HTTPS 主站
# 部署步骤：
#   1. 将下方 server 块内容合并进你的 Nginx 站点配置（宝塔：网站→设置→配置文件 末尾追加；或 /www/server/panel/vhost/nginx/cub3d-editor.cn.conf）
#   2. 把证书路径 ssl_certificate / ssl_certificate_key 改成你服务器上 cub3d-editor.cn 证书的真实路径
#   3. nginx -t && nginx -s reload
#   4. 确保 /www/wwwroot/139.196.104.56/downloads/versions.json 与安装包已上传

# —— IP / 未知 Host 直访：301 重定向到域名 ——
server {
    listen 80 default_server;
    server_name _;
    return 301 https://cub3d-editor.cn$request_uri;
}
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /www/server/panel/vhost/cert/cub3d-editor.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/cub3d-editor.cn/privkey.pem;
    return 301 https://cub3d-editor.cn$request_uri;
}

# —— 域名 HTTP → HTTPS ——
server {
    listen 80;
    server_name cub3d-editor.cn;
    return 301 https://$host$request_uri;
}

# —— 域名 HTTPS 主站 ——
server {
    listen 443 ssl;
    server_name cub3d-editor.cn;
    ssl_certificate     /www/server/panel/vhost/cert/cub3d-editor.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/cub3d-editor.cn/privkey.pem;

    root /www/wwwroot/139.196.104.56/;
    index index.html;

    # 静态资源缓存
    location ~* \.(js|css|svg|woff2?|png|jpg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
