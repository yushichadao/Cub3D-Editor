<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>插件控制台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0c0e16; color: #d7dce6;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }

  .bar {
    -webkit-app-region: drag;
    height: 42px; flex-shrink: 0;
    display: flex; align-items: center; gap: 10px;
    padding: 0 0 0 14px;
    border-bottom: 1px solid #222634;
    background: #10131d;
    font-size: 13px;
  }
  .bar .t { font-weight: 600; letter-spacing: .5px; }
  .bar .sp { flex: 1; }
  .bar button, .bar select, .bar input {
    -webkit-app-region: no-drag;
  }
  .bar .wc { display: flex; height: 42px; }
  .bar .wc button {
    width: 44px; height: 42px; border: 0; background: transparent;
    color: #98a0b3; cursor: pointer; font-size: 13px;
    font-family: "Segoe Fluent Icons", "Segoe MDL2 Assets", sans-serif;
  }
  .bar .wc button:hover { background: #ffffff14; color: #fff; }
  .bar .wc button.close:hover { background: #e81123; color: #fff; }

  .tools {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px;
    border-bottom: 1px solid #1b1f2b;
    font-size: 12.5px;
  }
  select, input[type="text"] {
    background: #171b26; border: 1px solid #262b3a; color: #d7dce6;
    padding: 5px 9px; border-radius: 7px; outline: none; font-size: 12.5px;
  }
  input[type="text"] { flex: 1; }
  select:focus, input:focus { border-color: #4a9eff; }
  button.act {
    background: transparent; border: 1px solid #262b3a; color: #b9c0cc;
    padding: 5px 12px; border-radius: 7px; cursor: pointer; font-size: 12.5px;
  }
  button.act:hover { border-color: #4a9eff; color: #4a9eff; }
  label { display: flex; align-items: center; gap: 5px; cursor: pointer; color: #98a0b3; }

  #log {
    flex: 1; overflow: auto; padding: 10px 14px;
    font-family: ui-monospace, Consolas, "Cascadia Mono", monospace;
    font-size: 12.5px; line-height: 1.7;
    white-space: pre-wrap; word-break: break-all;
  }
  #log .row { display: flex; gap: 10px; padding: 1px 0; }
  #log .time { color: #5a6478; flex-shrink: 0; }
  #log .tag { color: #7a83f0; flex-shrink: 0; min-width: 130px; }
  #log .msg { flex: 1; }
  #log .lv-error .msg { color: #f87171; }
  #log .lv-warn  .msg { color: #fbbf24; }
  #log .lv-ok    .msg { color: #4ade80; }
  #log::-webkit-scrollbar { width: 10px; }
  #log::-webkit-scrollbar-thumb { background: #262b3a; border-radius: 5px; }

  .foot {
    flex-shrink: 0; height: 28px;
    display: flex; align-items: center; gap: 14px;
    padding: 0 14px; border-top: 1px solid #1b1f2b;
    font-size: 11.5px; color: #5a6478;
  }
</style>
</head>
<body>
  <div class="bar">
    <span class="t">插件控制台</span>
    <span class="sp"></span>
    <div class="wc">
      <button id="w-min" title="最小化">&#xE921;</button>
      <button id="w-max" title="最大化">&#xE922;</button>
      <button id="w-close" class="close" title="关闭">&#xE8BB;</button>
    </div>
  </div>

  <div class="tools">
    <select id="f-plugin"><option value="">全部插件</option></select>
    <select id="f-level">
      <option value="">全部级别</option>
      <option value="info">信息</option>
      <option value="warn">警告</option>
      <option value="error">错误</option>
    </select>
    <input type="text" id="f-text" placeholder="按关键字过滤…">
    <label><input type="checkbox" id="f-auto" checked> 自动滚动</label>
    <button class="act" id="b-clear">清空</button>
    <button class="act" id="b-copy">复制全部</button>
  </div>

  <div id="log"></div>

  <div class="foot">
    <span id="s-count">0 条</span>
    <span id="s-plugins">插件 0 个</span>
    <span id="s-hint">日志上限 2000 条</span>
  </div>

<script>
(function () {
  'use strict';
  var D = window.desktop;
  if (!D) return;

  var MAX = 2000;
  var rows = [];
  var logEl = document.getElementById('log');
  var fPlugin = document.getElementById('f-plugin');
  var fLevel = document.getElementById('f-level');
  var fText = document.getElementById('f-text');
  var fAuto = document.getElementById('f-auto');
  var known = {};

  document.getElementById('w-min').onclick = function () { D.window.minimize(); };
  document.getElementById('w-max').onclick = function () { D.window.toggleMaximize(); };
  document.getElementById('w-close').onclick = function () { D.window.close(); };
  document.getElementById('b-clear').onclick = function () { rows = []; render(); };
  document.getElementById('b-copy').onclick = function () {
    D.clipboard.writeText(rows.map(function (r) {
      return new Date(r.time).toLocaleTimeString() + ' [' + r.tag + '] ' + r.message;
    }).join('\n'));
  };
  [fPlugin, fLevel].forEach(function (el) { el.onchange = render; });
  fText.oninput = render;

  function add(row) {
    rows.push(row);
    if (rows.length > MAX) rows.shift();
    if (row.tag && !known[row.tag]) {
      known[row.tag] = true;
      var o = document.createElement('option');
      o.value = row.tag; o.textContent = row.tag;
      fPlugin.appendChild(o);
      document.getElementById('s-plugins').textContent = '插件 ' + Object.keys(known).length + ' 个';
    }
    render();
  }

  function levelClass(r) {
    if (r.level === 'error') return 'lv-error';
    if (r.level === 'warn') return 'lv-warn';
    if (/完成|成功|ready|就绪|✔/.test(r.message)) return 'lv-ok';
    return '';
  }

  function render() {
    var p = fPlugin.value, l = fLevel.value, t = fText.value.trim().toLowerCase();
    var html = '';
    var shown = 0;
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      if (p && r.tag !== p) continue;
      if (l && r.level !== l) continue;
      if (t && r.message.toLowerCase().indexOf(t) < 0) continue;
      shown++;
      html += '<div class="row ' + levelClass(r) + '">' +
        '<span class="time">' + new Date(r.time).toLocaleTimeString() + '</span>' +
        '<span class="tag">' + esc(r.tag) + '</span>' +
        '<span class="msg">' + esc(r.message) + '</span></div>';
    }
    logEl.innerHTML = html;
    document.getElementById('s-count').textContent = shown + ' / ' + rows.length + ' 条';
    if (fAuto.checked) logEl.scrollTop = logEl.scrollHeight;
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
    });
  }

  D.plugin.onLog(function (m) {
    add({ time: m.entry.time, tag: m.pluginId, level: m.entry.level, message: m.entry.message });
  });
  D.plugin.onStatus(function (m) {
    add({ time: Date.now(), tag: m.pluginId, level: m.status === 'error' ? 'error' : 'info',
          message: '状态变更 → ' + m.status + (m.error ? '（' + m.error + '）' : '') });
  });
  D.plugin.onProgress(function (m) {
    add({ time: Date.now(), tag: m.pluginId, level: 'info',
          message: '进度 ' + (m.percent == null ? '' : m.percent + '% ') + (m.message || '') });
  });
  D.runtime.onLog(function (m) {
    add({ time: Date.now(), tag: 'runtime:' + m.id, level: /失败|error/i.test(m.line) ? 'error' : 'info', message: m.line });
  });

  // 载入已有插件的历史日志
  D.plugin.list().then(function (r) {
    var list = (r && r.list) || [];
    var chain = Promise.resolve();
    list.forEach(function (p) {
      chain = chain.then(function () {
        return D.plugin.logs(p.id).then(function (rr) {
          ((rr && rr.logs) || []).forEach(function (e) {
            rows.push({ time: e.time, tag: p.id, level: e.level, message: e.message });
            if (!known[p.id]) {
              known[p.id] = true;
              var o = document.createElement('option');
              o.value = p.id; o.textContent = p.id;
              fPlugin.appendChild(o);
            }
          });
        });
      });
    });
    chain.then(function () {
      rows.sort(function (a, b) { return a.time - b.time; });
      document.getElementById('s-plugins').textContent = '插件 ' + Object.keys(known).length + ' 个';
      render();
    });
  });
})();
</script>
</body>
</html>
