appId: com.yushichadao.cube3d
productName: 立方三维设计工坊
copyright: Copyright © 2026 Yushichadao. All Rights Reserved.

directories:
  output: out-portable
  buildResources: build

files:
  - index.html
  - server.js
  - package.json
  - LICENSE
  - README.md
  - three/**/*
  - language/**/*
  - docs/**/*
  - shell/**/*
  - electron/**/*
  - "!**/.userdata/**"
  - "!dist/**"
  - "!scripts/**"

asar: true
asarUnpack:
  - electron/plugin-sdk/**

extraResources:
  - from: plugins
    to: plugins
    filter: ["**/*"]
  - from: langpacks
    to: langpacks
    filter: ["**/*"]
  - from: build/icon.ico
    to: build/icon.ico

compression: maximum
removePackageScripts: true
buildDependenciesFromSource: false

win:
  icon: build/icon.ico
  executableName: cube3d-studio
  target:
    - target: portable
      arch: [x64]
  requestedExecutionLevel: asInvoker
  fileAssociations:
    - ext: l3d
      name: 立方场景文件
      description: 立方三维设计工坊场景文件
      icon: build/icon.ico
      role: Editor

portable:
  artifactName: Cube3D-Portable-${version}-x64.${ext}
  requestExecutionLevel: user
  unicode: true

nsis:
  artifactName: Cube3D-Studio-Setup-${version}-x64.${ext}

publish: null
