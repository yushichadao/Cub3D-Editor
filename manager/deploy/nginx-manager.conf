# ===== Cub3D 更新管理器 · nginx 配置 =====
# 用法：放到 /etc/nginx/sites-available/cub3d-manager.conf，
#       ln -s 到 sites-enabled，nginx -t && systemctl reload nginx

# ① 域名主站：cub3d-editor.cn（客户端 HOSTS[0] 直连，BASE=''）
server {
    listen 80;
    server_name cub3d-editor.cn www.cub3d-editor.cn;

    # 安装包直传磁盘（不走 Node，支持 100MB+ exe 大文件、断点续传）
    location /downloads/ {
        alias /var/www/cub3d/downloads/;
        add_header Access-Control-Allow-Origin *;
        expires 1h;
        try_files $uri =404;
    }

    # 管理后台页面与 API 反代到 manager（BASE=''）
    location / {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # 上传大安装包（multer 在 Node 侧，需放宽）
        client_max_body_size 512m;
    }
}

# ② 备用 IP：139.196.104.56/manager（客户端 HOSTS[1]，去前缀转发到 BASE='' 实例）
server {
    listen 80;
    server_name 139.196.104.56;

    # IP 备用源的安装包也直传磁盘
    location /manager/downloads/ {
        alias /var/www/cub3d/downloads/;
        add_header Access-Control-Allow-Origin *;
        expires 1h;
        rewrite ^/manager/downloads/(.*)$ /$1 break;
        try_files $uri =404;
    }

    # /manager/api/... 与 /manager（后台页）去前缀转发到 3000
    location /manager/ {
        rewrite ^/manager/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 512m;
    }
    location = /manager {
        return 302 /manager/;
    }
}
