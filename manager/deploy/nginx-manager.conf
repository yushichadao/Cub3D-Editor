# ===== Cub3D 更新管理器 · nginx 配置 =====
# 用法：放到 /etc/nginx/sites-available/cub3d-manager.conf，
#       ln -s 到 sites-enabled，nginx -t && systemctl reload nginx
#
# 站点根目录已是 /www/wwwroot/139.196.104.56（含 IP），
# manager 以 BASE='' 直接挂在 IP 根下，无需 /manager/ 前缀。

# IP 主站：139.196.104.56（客户端 HOSTS 直连，BASE=''）
server {
    listen 80;
    server_name 139.196.104.56;

    # 安装包直传磁盘（不走 Node，支持 100MB+ exe 大文件、断点续传）
    location /downloads/ {
        alias /www/wwwroot/139.196.104.56/downloads/;
        add_header Access-Control-Allow-Origin *;
        expires 1h;
        try_files $uri =404;
    }

    # 管理后台页面与 API 反代到 manager（BASE=''）
    location / {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # 上传大安装包（multer 在 Node 侧，需放宽）
        client_max_body_size 512m;
    }
}
