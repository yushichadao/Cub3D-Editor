<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!-- 反篡改守护：F12/开发者工具可用；但 F12 Elements 面板删除任何元素都会被自动恢复（防走后门）。
     程序自身通过 remove()/removeChild() 等方法删除的节点会被豁免，不弹提示、不干预。 -->
<script>
(function(){ 'use strict';
  var __skip = (typeof WeakSet === 'function') ? new WeakSet() : null;
  try{
    var _r = Element.prototype.remove;
    Element.prototype.remove = function(){ if(__skip) __skip.add(this); return _r.apply(this, arguments); };
    var _rc = Node.prototype.removeChild;
    Node.prototype.removeChild = function(c){ if(__skip && c && c.nodeType === 1) __skip.add(c); return _rc.apply(this, arguments); };
    var _rp = Node.prototype.replaceChild;
    Node.prototype.replaceChild = function(n, o){ if(__skip && o && o.nodeType === 1) __skip.add(o); return _rp.apply(this, arguments); };
    function hookProp(obj, prop){
      var d = Object.getOwnPropertyDescriptor(obj, prop);
      if(!d || !d.set) return;
      var g = d.get, s = d.set;
      Object.defineProperty(obj, prop, {
        configurable: true,
        enumerable: d.enumerable,
        get: function(){ return g ? g.call(this) : undefined; },
        set: function(v){
          if(__skip){
            __skip.add(this);
            if(this.children){ for(var i=0;i<this.children.length;i++) __skip.add(this.children[i]); }
          }
          return s.call(this, v);
        }
      });
    }
    hookProp(Element.prototype, 'innerHTML');
    hookProp(Element.prototype, 'outerHTML');
    hookProp(Node.prototype, 'textContent');
  }catch(e){}
  function showTamperTip(tag){
    var tip=document.getElementById('tamperTip');
    if(!tip){
      tip=document.createElement('div');
      tip.id='tamperTip';
      tip.style.cssText='position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:2147483646;background:#1a1c2a;color:#f87171;border:1px solid #f87171;border-radius:8px;padding:9px 14px;font:12.5px/1.5 system-ui;box-shadow:0 6px 18px rgba(0,0,0,.35);max-width:90vw;';
      document.body.appendChild(tip);
    }
    tip.textContent='⚠ 检测到删除元素'+(tag?('（'+tag+'）'):'')+'，已自动恢复（禁止删除元素）';
    tip.style.opacity='1';
    clearTimeout(tip._tm);
    tip._tm=setTimeout(function(){ tip.style.opacity='0'; }, 2400);
  }
  var busy=false;
  function onMuts(muts){
    if(busy) return; busy=true;
    var jobs=[];
    for(var i=0;i<muts.length;i++){
      var m=muts[i];
      if(m.type!=='childList' || !m.removedNodes || m.removedNodes.length===0) continue;
      if(m.removedNodes.length>=2) continue; // 批量整体重写（程序渲染），跳过
      var n=m.removedNodes[0];
      if(n.nodeType!==1) continue;
      if(__skip && __skip.has(n)){ try{ __skip.delete(n); }catch(e){} continue; } // 程序自身删除，豁免
      if(m.addedNodes && m.addedNodes.length > 0) continue; // 同批重建（程序 innerHTML 等重写），跳过
      jobs.push({node:n, parent:m.target, before:m.nextSibling});
    }
    jobs.forEach(function(j){
      var parent=j.parent;
      if(!parent || !parent.isConnected) return;
      try{
        if(j.before && j.before.isConnected) parent.insertBefore(j.node, j.before);
        else parent.appendChild(j.node);
      }catch(e){ try{ parent.appendChild(j.node); }catch(e2){} }
      showTamperTip(j.node.id?('#'+j.node.id):j.node.tagName.toLowerCase());
    });
    busy=false;
  }
  function init(){
    if(window.MutationObserver) new MutationObserver(onMuts).observe(document.documentElement,{childList:true,subtree:true});
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>

  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden;

  .lang button.active{background:var(--accent);color:#0c1413}
  .nav-toggle{display:none;background:var(--bg-soft);border:1px solid var(--line);color:var(--text);border-radius:8px;width:38px;height:38px;font-size:16px;cursor:pointer;flex:0 0 auto}

  .lang-mobile button{border:0;background:transparent;color:var(--dim);font-size:12px;font-weight:600;padding:4px 2px;border-radius:6px;cursor:pointer;font-family:inherit;transition:.2s;flex:1 1 0;min-width:max-content;white-space:nowrap;text-align:center}
  .lang-mobile button.active{background:var(--accent);color:#0c1413}
  .toprow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 0}
  .back{color:var(--dim);font-size:13.5px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:.2s}
  .back:hover{color:var(--accent)}
  .back::before{content:"←"}
  html[lang="ar"] .back::before{content:"→"}
  .legal{padding:24px 0 72px}
  .legal h1{font-size:clamp(22px,4vw,30px);font-weight:700;margin:20px 0 22px;text-wrap:balance;color:var(--accent)}
  .eff-date{margin-top:18px;color:var(--dim-2);font-size:12.5px}
  .panel{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:clamp(20px,4vw,36px)}
  .panel h4{color:var(--accent);font-size:15.5px;font-weight:700;margin:26px 0 10px}
  .panel h4:first-child{margin-top:0}
  .panel p{color:var(--dim);font-size:14.5px;margin-bottom:13px;line-height:1.85;text-wrap:pretty}
  .panel p:last-child{margin-bottom:0}
  .panel strong{color:var(--text);font-weight:600}
  .panel ul{margin:0 0 13px 22px;color:var(--dim);font-size:14.5px;line-height:1.85}
  .panel li{margin-bottom:6px}
  .panel a{color:var(--accent);text-decoration:none}
  .panel a:hover{text-decoration:underline}
  footer{margin-top:8px;padding:26px 0 44px;border-top:1px solid var(--line);color:var(--dim-2);font-size:12.5px}
  footer .foot{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
  footer a{color:var(--dim);text-decoration:none;transition:color .2s}
  footer a:hover{color:var(--accent)}
  .icp-slot{display:inline-flex;min-width:170px;min-height:24px;padding:2px 12px;border:1px dashed var(--line);border-radius:7px}
  @media(max-width:600px){.brand span{display:none}.bar .lang{display:none}.nav-toggle{display:block}}
  /* ===== 阿拉伯语字体（与宣传页一致）===== */
  @font-face{

  }
  html[lang="ar"] .panel, html[lang="ar"] .panel p, html[lang="ar"] .panel li,

<body data-term="privacy">
<header>

<script>(function(){var c=/(^|\.)cub3d-editor\.cn$/i.test(location.hostname||'');var e=document.querySelector('.icp-slot');if(e)e.style.display=c?'':'none';})();</script>
<script src="assets/legal-i18n.js"></script>
<script>
const LANGS=[
  {code:'zh-CN',label:'简'},{code:'zh-TW',label:'繁'},{code:'en',label:'EN'},
  {code:'ja',label:'日'},{code:'ko',label:'한'},{code:'ru',label:'RU'},
  {code:'es',label:'ES'},{code:'fr',label:'FR'},{code:'ar',label:'ع'}
];
const TERM = document.body.dataset.term; // tos | disclaimer | privacy
const KEYS = { tos:{t:'tosLink',b:'tosBody'}, disclaimer:{t:'disclaimerLink',b:'disclaimerBody'}, privacy:{t:'privacyLink',b:'privacyBody'} };
const K = KEYS[TERM] || KEYS.tos;
const LEGAL = window.LEGAL || {};

function normalize(l){
  if (LEGAL[l]) return l;
  if (l && l.startsWith('zh')) return (l.includes('TW')||l.includes('HK')||l.includes('Hant'))?'zh-TW':'zh-CN';
  const m={ar:'ar',ja:'ja',ko:'ko',ru:'ru',es:'es',en:'en',fr:'fr'};
  if (l) for (const k in m) if (l.startsWith(k)) return m[k];
  return 'zh-CN';
}
let cur = normalize(localStorage.getItem('cub3d_lang') || new URLSearchParams(location.search).get('lang') || (navigator.language||'zh-CN').slice(0,7));

function render(){
  const dict = LEGAL[cur] || LEGAL['zh-CN'] || {};
  document.documentElement.lang = cur;
  document.documentElement.dir = (cur==='ar')?'rtl':'ltr';
  const t = dict[K.t] || '';
  document.title = 'Cub3D Editor — ' + t;
  document.getElementById('docTitle').textContent = t;
  // 正文开头的 <h4> 与页面 h1 标题重复，注入时移除
  const raw = dict[K.b] || '';
  document.getElementById('docBody').innerHTML = raw.replace(/^\s*<h4>[\s\S]*?<\/h4>/, '');
  // 追加生效日期脚注（各语言字典 effectiveDate 字段，缺省用简体）
  const eff = dict.effectiveDate || '本文件生效日期：2026年8月21日';
  document.getElementById('docBody').insertAdjacentHTML('beforeend', '<p class="eff-date">'+eff+'</p>');
  document.getElementById('backLink').href = 'index.html?lang=' + encodeURIComponent(cur);
  const bl = document.getElementById('backLink');
  if (bl && dict.backHome) bl.textContent = dict.backHome;
  const hl = document.querySelector('[data-i18n="homeLink"]');
  if (hl && dict.homeLink) hl.textContent = dict.homeLink;
  document.querySelectorAll('#lang button, #langMobile button').forEach(b=>b.classList.toggle('active', b.dataset.lang===cur));
}
function buildLangs(container){ LANGS.forEach(({code,label})=>{ const b=document.createElement('button'); b.dataset.lang=code; b.textContent=label; container.appendChild(b); }); }
function bindLangClick(container){ container.addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b)return; cur=normalize(b.dataset.lang); localStorage.setItem('cub3d_lang', cur); render(); }); }
buildLangs(document.getElementById('lang'));
buildLangs(document.getElementById('langMobile'));
bindLangClick(document.getElementById('lang'));
bindLangClick(document.getElementById('langMobile'));
// 菜单开关：窄屏点击 ☰ 展开/收起语言区
const navToggle = document.getElementById('navToggle');
const navPanel = document.getElementById('navPanel');
if(navToggle && navPanel){
  navToggle.addEventListener('click', ()=>{ navPanel.style.display = (navPanel.style.display==='block') ? 'none' : 'block'; });
  document.addEventListener('click', e=>{
    if(!navPanel.contains(e.target) && e.target !== navToggle && navPanel.style.display==='block') navPanel.style.display='none';
  });
}
render();
</script>
</body>
