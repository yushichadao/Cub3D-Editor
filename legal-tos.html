<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Cub3D Editor — Terms of Service</title>
<meta name="description" content="Cub3D Editor 服务协议。离线优先、无需账号、数据本地保存的跨平台 3D/2D 场景编辑器。">
<style>
  :root{
    --bg:#0e0f13; --bg-soft:#16181f; --panel:#181a21; --line:rgba(255,255,255,.09);
    --accent:#5ad1c4; --accent-weak:rgba(90,209,196,.12);
    --text:#eef0f3; --dim:#9aa0ab; --dim-2:#6f7581;
    --radius:12px; --maxw:820px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Hiragino Sans","Yu Gothic","Meiryo","Noto Sans JP","MS PGothic",sans-serif}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
  header{position:sticky;top:0;z-index:100;background:rgba(14,15,19,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;color:var(--text);text-decoration:none;min-width:0}
  .brand .mark{width:26px;height:26px;border-radius:7px;background:var(--accent);color:#0c1413;display:grid;place-items:center;font-weight:800;font-size:13px;flex:0 0 auto}
  .brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lang{display:flex;gap:2px;background:var(--bg-soft);border:1px solid var(--line);border-radius:8px;padding:2px}
  .lang button{border:0;background:transparent;color:var(--dim);font-size:12px;font-weight:600;padding:4px 7px;border-radius:6px;cursor:pointer;font-family:inherit;transition:.2s}
  .lang button.active{background:var(--accent);color:#0c1413}
  .toprow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 0}
  .back{color:var(--dim);font-size:13.5px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:.2s}
  .back:hover{color:var(--accent)}
  .back::before{content:"←"}
  html[lang="ar"] .back::before{content:"→"}
  .legal{padding:24px 0 72px}
  .legal h1{font-size:clamp(22px,4vw,30px);font-weight:700;margin:20px 0 22px;text-wrap:balance}
  .panel{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:clamp(20px,4vw,36px)}
  .panel h4{color:var(--accent);font-size:15.5px;font-weight:700;margin:26px 0 10px}
  .panel h4:first-child{margin-top:0}
  .panel p{color:var(--dim);font-size:14.5px;margin-bottom:13px;line-height:1.85;text-wrap:pretty}
  .panel p:last-child{margin-bottom:0}
  .panel strong{color:var(--text);font-weight:600}
  .panel ul{margin:0 0 13px 22px;color:var(--dim);font-size:14.5px;line-height:1.85}
  .panel li{margin-bottom:6px}
  .panel a{color:var(--accent);text-decoration:none}
  .panel a:hover{text-decoration:underline}
  footer{margin-top:8px;padding:26px 0 44px;border-top:1px solid var(--line);color:var(--dim-2);font-size:12.5px}
  footer .foot{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
  footer a{color:var(--dim);text-decoration:none;transition:color .2s}
  footer a:hover{color:var(--accent)}
  .icp-slot{display:inline-flex;min-width:170px;min-height:24px;padding:2px 12px;border:1px dashed var(--line);border-radius:7px}
  @media(max-width:600px){.lang button{padding:3px 5px;font-size:11px}}
  /* ===== 阿拉伯语字体（与宣传页一致）===== */
  @font-face{
    font-family:"Noto Kufi Arabic";
    font-style:normal; font-weight:400; font-display:swap;
    src:url("assets/fonts/noto-kufi-arabic-400.woff2") format("woff2");
  }
  @font-face{
    font-family:"Noto Kufi Arabic";
    font-style:normal; font-weight:700; font-display:swap;
    src:url("assets/fonts/noto-kufi-arabic-700.woff2") format("woff2");
  }
  html[lang="ar"] body{
    font-family:"Noto Kufi Arabic","Sakkal Majalla","Simplified Arabic","Andalus","Segoe UI","Noto Sans Arabic","Geeza Pro","Tahoma",serif;
  }
  html[lang="ar"] .panel, html[lang="ar"] .panel p, html[lang="ar"] .panel li,
  html[lang="ar"] .panel h4, html[lang="ar"] .panel strong, html[lang="ar"] .panel a,
  html[lang="ar"] .legal h1, html[lang="ar"] .back{
    font-family:"Noto Kufi Arabic","Sakkal Majalla","Simplified Arabic","Andalus","Segoe UI","Noto Sans Arabic","Geeza Pro","Tahoma",serif;
  }
  html[lang="ar"] .brand, html[lang="ar"] .lang button{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Arabic","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Hiragino Sans","Yu Gothic","Meiryo","Noto Sans JP","Malgun Gothic",sans-serif;
  }
</style>
</head>
<body data-term="tos">
<header>
  <div class="wrap bar">
    <a class="brand" href="index.html"><span class="mark">C</span><span>Cub3D Editor</span></a>
    <div class="lang" id="lang"></div>
  </div>
</header>
<main class="wrap">
  <div class="toprow">
    <a class="back" id="backLink" href="index.html" data-i18n="backHome">返回主页</a>
  </div>
  <section class="legal">
    <h1 id="docTitle">服务协议</h1>
    <div class="panel" id="docBody"></div>
  </section>
</main>
<footer>
  <div class="wrap foot">
    <div>Copyright © 2026-Present Yushichadao. All Rights Reserved.</div>
    <a href="index.html" data-i18n="homeLink">Cub3D Editor 主页</a>
    <!-- ICP 备案号预留空框：现阶段无备案，仅画框占位不写内容，后续在此填写备案号 -->
    <span class="icp-slot" aria-hidden="true"></span>
  </div>
</footer>
<script src="assets/legal-i18n.js"></script>
<script>
const LANGS=[
  {code:'zh-CN',label:'简'},{code:'zh-TW',label:'繁'},{code:'en',label:'EN'},
  {code:'ja',label:'日'},{code:'ko',label:'한'},{code:'ru',label:'RU'},
  {code:'es',label:'ES'},{code:'fr',label:'FR'},{code:'ar',label:'ع'}
];
const TERM = document.body.dataset.term; // tos | disclaimer | privacy
const KEYS = { tos:{t:'tosLink',b:'tosBody'}, disclaimer:{t:'disclaimerLink',b:'disclaimerBody'}, privacy:{t:'privacyLink',b:'privacyBody'} };
const K = KEYS[TERM] || KEYS.tos;
const LEGAL = window.LEGAL || {};

function normalize(l){
  if (LEGAL[l]) return l;
  if (l && l.startsWith('zh')) return (l.includes('TW')||l.includes('HK')||l.includes('Hant'))?'zh-TW':'zh-CN';
  const m={ar:'ar',ja:'ja',ko:'ko',ru:'ru',es:'es',en:'en',fr:'fr'};
  if (l) for (const k in m) if (l.startsWith(k)) return m[k];
  return 'zh-CN';
}
let cur = normalize(localStorage.getItem('cub3d_lang') || new URLSearchParams(location.search).get('lang') || (navigator.language||'zh-CN').slice(0,7));

function render(){
  const dict = LEGAL[cur] || LEGAL['zh-CN'] || {};
  document.documentElement.lang = cur;
  document.documentElement.dir = (cur==='ar')?'rtl':'ltr';
  const t = dict[K.t] || '';
  document.title = 'Cub3D Editor — ' + t;
  document.getElementById('docTitle').textContent = t;
  // 正文开头的 <h4> 与页面 h1 标题重复，注入时移除
  const raw = dict[K.b] || '';
  document.getElementById('docBody').innerHTML = raw.replace(/^\s*<h4>[\s\S]*?<\/h4>/, '');
  document.getElementById('backLink').href = 'index.html?lang=' + encodeURIComponent(cur);
  const bl = document.getElementById('backLink');
  if (bl && dict.backHome) bl.textContent = dict.backHome;
  const hl = document.querySelector('[data-i18n="homeLink"]');
  if (hl && dict.homeLink) hl.textContent = dict.homeLink;
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('active', b.dataset.lang===cur));
}
const langEl = document.getElementById('lang');
LANGS.forEach(({code,label})=>{ const b=document.createElement('button'); b.dataset.lang=code; b.textContent=label; langEl.appendChild(b); });
langEl.addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b)return; cur=normalize(b.dataset.lang); localStorage.setItem('cub3d_lang', cur); render(); });
render();
</script>
</body>
</html>
