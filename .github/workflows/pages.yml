name: Deploy Site to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'legal-*.html'
      - 'assets/**'
      - 'web/**'
      - 'shared/**'
      - 'tools/**'
      - 'downloads/**'
      - '.nojekyll'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync shared resources
        run: node tools/sync-shared.mjs

      - name: Build site (landing page + web app)
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp -r web _site/web
          cp -r assets _site/assets
          cp -r shared _site/shared
          cp legal-*.html _site/ 2>/dev/null || true
          cp .nojekyll _site/
          # 更新元数据（境外客户端经 /Cub3D-Editor/downloads/update-doc.json 检测更新；
          # 安装包走 GitHub Releases，不在此构建）
          mkdir -p _site/downloads
          cp downloads/update-doc.json _site/downloads/ 2>/dev/null || true
          cp downloads/versions.json _site/downloads/ 2>/dev/null || true
          cp downloads/version.txt _site/downloads/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
