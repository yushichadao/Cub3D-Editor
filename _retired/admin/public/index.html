<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>管理后台 · Cub3D Editor</title>
<style>
  :root {
    --bg-deep: #0c0e16; --bg-panel: rgba(20, 22, 34, 0.82); --bg-panel-solid: #14161f;
    --accent: #6ee7ff; --accent-2: #c084fc; --accent-3: #fb7185; --warn: #fbbf24; --ok: #34d399;
    --text: #e8e8f0; --text-dim: #8b8ba0; --border: rgba(110, 231, 255, 0.18);
    --radius: 14px; --shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
    --input-bg: rgba(255,255,255,0.05); --control-bg: rgba(255,255,255,0.05);
    --control-bg-hover: rgba(255,255,255,0.08); --section-border: rgba(255,255,255,0.05);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100%; background: var(--bg-deep); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased; padding: 24px 14px 40px; display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  * { scrollbar-width: none; -ms-overflow-style: none; }
  *::-webkit-scrollbar { display: none; }
  .page-head { text-align:center; max-width: 980px; display:flex; flex-direction:column; align-items:center; gap:12px; }
  .page-head h1 { font-size: 19px; font-weight: 700; letter-spacing: .5px; }
  .tag { display:inline-block; font-size:11px; padding:3px 9px; border-radius:999px; background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); border:1px solid var(--border); margin:0 3px; }
  .tag.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
  .tag.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .tag.stop { background: color-mix(in srgb, var(--accent-3) 18%, transparent); color: var(--accent-3); }
  .panel { width: min(980px, 100%); border:1px solid var(--border); border-radius: var(--radius); background: var(--bg-panel-solid); overflow:hidden; }
  .panel-head { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .panel-head h2 { font-size:14px; font-weight:600; }
  .panel-head .hint { font-size:12px; color:var(--text-dim); }
  .panel-body { padding: 14px 16px; }
  .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .btn {
    padding:8px 14px; border-radius:9px; font-size:13px; cursor:pointer; font-family:inherit;
    background: var(--control-bg); color:var(--text); border:1px solid var(--border); transition: all .18s;
  }
  .btn:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); border-color: var(--accent); }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color:#0a0a14; font-weight:600; border-color:transparent; }
  .btn.danger { border-color: color-mix(in srgb, var(--accent-3) 45%, transparent); color: var(--accent-3); }

  /* ===== 登录门 ===== */
  #login-gate { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
    background: rgba(8,10,18,0.92); backdrop-filter: blur(6px); }
  .login-card { width:min(340px,92vw); border:1px solid var(--border); border-radius:var(--radius); background:var(--bg-panel-solid);
    padding:30px 26px; display:flex; flex-direction:column; gap:14px; box-shadow:var(--shadow); }
  .login-card h2 { font-size:18px; text-align:center; font-weight:700; }
  .login-logo { width:54px; height:54px; border-radius:14px; margin:0 auto 4px;
    background:conic-gradient(from 0deg, var(--accent), var(--accent-2), var(--accent-3), var(--accent)); }
  .login-card input[type=text], .login-card input[type=password] {
    background:var(--input-bg); border:1px solid var(--border); border-radius:9px; color:var(--text);
    padding:11px 12px; font-size:14px; font-family:inherit; outline:none; width:100%; color-scheme:dark; }
  .login-card input:focus { border-color:var(--accent); }
  .lg-remember { font-size:12px; color:var(--text-dim); display:flex; align-items:center; gap:8px; cursor:pointer; }
  .lg-msg { font-size:12.5px; color:var(--accent-3); min-height:16px; text-align:center; }

  /* ===== 项目选择卡片 ===== */
  .pkg-cards { display:flex; flex-direction:column; gap:12px; }
  .pkg-cards-row { display:flex; flex-wrap:wrap; gap:14px; justify-content:center; }
  .pkg-card { flex:1 1 260px; max-width:340px; text-decoration:none; color:var(--text);
    border:1px solid var(--border); border-radius:12px; padding:18px 16px; background:var(--control-bg);
    display:flex; flex-direction:column; gap:8px; transition: all .18s; }
  .pkg-card:hover { background:var(--control-bg-hover); border-color: color-mix(in srgb, var(--accent) 45%, transparent); transform: translateY(-2px); }
  .pk { display:flex; align-items:center; gap:8px; }
  .pk-badge { font-size:11px; padding:2px 9px; border-radius:999px; border:1px solid var(--border); }
  .pk-badge.cn { color:var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .pk-badge.android { color:var(--accent-3); border-color: color-mix(in srgb, var(--accent-3) 40%, transparent); }
  .pk-name { font-size:15px; font-weight:700; }
  .pk-file { font-size:12.5px; color:var(--text-dim); line-height:1.6; }

  /* ===== 弹窗 / toast（登录与密码修改共用） ===== */
  .pwd-modal { position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center;
    background:rgba(8,10,18,0.7); backdrop-filter:blur(4px); }
  .pwd-modal.show { display:flex; }
  .pwd-card { width:min(360px,92vw); border:1px solid var(--border); border-radius:var(--radius); background:var(--bg-panel-solid);
    padding:24px; display:flex; flex-direction:column; gap:12px; box-shadow:var(--shadow); }
  .pwd-card h3 { font-size:16px; font-weight:700; }
  .pwd-card input { background:var(--input-bg); border:1px solid var(--border); border-radius:8px; color:var(--text);
    padding:10px 12px; font-size:13px; font-family:inherit; outline:none; color-scheme:dark; }
  .pwd-card input:focus { border-color:var(--accent); }
  .pwd-row { display:flex; gap:10px; justify-content:flex-end; }
  .pwd-msg { font-size:12.5px; color:var(--accent-3); min-height:14px; }
  .toast { position:fixed; left:50%; bottom:42px; transform:translateX(-50%) translateY(20px); z-index:80;
    background:rgba(20,22,34,0.96); border:1px solid var(--border); color:var(--text); padding:10px 18px;
    border-radius:10px; font-size:13px; opacity:0; transition:all .25s; pointer-events:none; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .pwd-wrap { position:relative; }

  /* ===== 自动登录状态卡片（门户主界面顶部） ===== */
  #auto-row { width:min(560px,100%); }
  .auto-card { width:100%; display:flex; align-items:center; gap:12px; padding:10px 14px;
    border:1px solid var(--border); border-radius:11px; background:var(--control-bg); }
  .auto-card.off { opacity:.85; }
  .auto-ico { font-size:20px; }
  .auto-info { flex:1; line-height:1.5; }
  .auto-info .t { font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:7px; }
  .auto-info .d { font-size:12px; color:var(--text-dim); }
  .ok-dot { width:8px; height:8px; border-radius:50%; background:var(--ok); box-shadow:0 0 8px var(--ok); display:inline-block; }
  .auto-action .btn { padding:6px 12px; font-size:12.5px; }
</style>
<script src="/admin/assets/guard.js" defer></script>
</head>
<body>
  <!-- ===== 登录门 ===== -->
  <div id="login-gate" data-protect="login-gate">
    <div class="login-card">
      <div class="login-logo"></div>
      <h2>管理后台</h2>
      <input type="text" id="lg-user" placeholder="账号" autocomplete="username" />
      <input type="password" id="lg-pass" placeholder="密码" autocomplete="current-password" />
      <label class="lg-remember">
        <input type="checkbox" id="lg-remember" checked />
        <span>本设备记住我（自动登录）</span>
      </label>
      <button class="btn primary" id="lg-btn">登 录</button>
      <p class="lg-msg" id="lg-msg"></p>
    </div>
  </div>

  <!-- 主界面（未登录前隐藏） -->
  <div id="admin-main" style="display:none; width:100%; flex-direction:column; align-items:center; gap:18px;">
    <div class="page-head">
      <h1>管理后台 <span class="tag">门户</span></h1>
      <div id="auto-row"></div>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn" id="btn-pwd">🔑 修改密码</button>
        <button class="btn" id="btn-logout">退出登录</button>
      </div>
    </div>

    <!-- 项目选择：两个下辖系统（入口） -->
    <div class="panel">
      <div class="panel-head"><h2>🧭 选择功能</h2><span class="hint">管理后台下辖四大功能（共享同一登录态）</span></div>
      <div class="panel-body">
        <div class="pkg-cards"><div class="pkg-cards-row">
          <a class="pkg-card" href="/admin/build/" style="flex:0 0 260px;">
            <div class="pk"><span class="pk-badge android">① 打包</span><span class="pk-name">本地打包</span></div>
            <div class="pk-file">统一短版本号（X.X.X）、勾选包类型、本地构建安装包；构建时自动注入长+短版本号（长号=打包日 YYYYMMDD，未打包态 00000000）</div>
          </a>
          <a class="pkg-card" href="/admin/distribute/" style="flex:0 0 260px;">
            <div class="pk"><span class="pk-badge cn">② 分发</span><span class="pk-name">分发至服务器</span></div>
            <div class="pk-file">将构建产物分发到境内 downloads/ 与境外 GitHub；Web 分发时注入长版本号</div>
          </a>
          <a class="pkg-card" href="/admin/update/" style="flex:0 0 260px;">
            <div class="pk"><span class="pk-badge cn">③ 推送</span><span class="pk-name">更新推送</span></div>
            <div class="pk-file">发布更新话术、按平台区分展示长短版本号、境内外推送（Web 仅显示长版本号）</div>
          </a>
          <a class="pkg-card" href="/admin/files/" style="flex:0 0 260px;">
            <div class="pk"><span class="pk-badge cn">④ 文件</span><span class="pk-name">文件系统</span></div>
            <div class="pk-file">以本服务器为中枢联通本地电脑 / 国内 downloads / 国际 GitHub，安装包一键流转</div>
          </a>
        </div></div>
      </div>
    </div>
  </div>

  <!-- 修改密码浮窗 -->
  <div class="pwd-modal" id="pwd-modal">
    <div class="pwd-card">
      <h3>修改密码</h3>
      <input type="password" id="pm-old" placeholder="当前密码" autocomplete="current-password" />
      <input type="password" id="pm-new" placeholder="新密码" autocomplete="new-password" />
      <input type="password" id="pm-new2" placeholder="再次输入新密码" autocomplete="new-password" />
      <p class="pwd-msg" id="pm-msg"></p>
      <div class="pwd-row">
        <button class="btn primary" id="pm-save">确认修改</button>
        <button class="btn" id="pm-cancel">取消</button>
      </div>
    </div>
  </div>

  <!-- 通用确认弹窗 -->
  <div class="pwd-modal" id="cfm-modal">
    <div class="pwd-card">
      <h3 id="cfm-title">确认</h3>
      <p id="cfm-msg" style="font-size:13px; color:var(--text-dim); line-height:1.8; margin:2px 0 4px;"></p>
      <p class="pwd-msg" id="cfm-err"></p>
      <div class="pwd-row" style="justify-content:flex-end;">
        <button class="btn primary" id="cfm-yes">确定</button>
        <button class="btn" id="cfm-no">取消</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';
  const $ = id => document.getElementById(id);

  // 密码框：自绘白色 SVG 眼睛（隐藏原生 reveal）
  (function initPwdEyes(){
    document.querySelectorAll('input[type="password"]').forEach(function(inp){
      if(inp.dataset.pwdEye) return;
      inp.dataset.pwdEye = '1';
      const wrap = document.createElement('div');
      wrap.className = 'pwd-wrap';
      inp.parentNode.insertBefore(wrap, inp);
      wrap.appendChild(inp);
    });
    document.addEventListener('click', function(e){
      const inp = e.target;
      if(!(inp instanceof HTMLInputElement)) return;
      if(inp.type !== 'password' && !(inp.type === 'text' && inp.classList.contains('is-pwd'))) return;
      const rect = inp.getBoundingClientRect();
      const fromRight = rect.right - e.clientX;
      if(fromRight <= 40){
        e.preventDefault();
        if(inp.type === 'password'){ inp.type = 'text'; inp.classList.add('is-pwd'); }
        else { inp.type = 'password'; inp.classList.remove('is-pwd'); }
      }
    });
  })();

  /* ============ 鉴权（服务端 ADMIN_TOKEN） ============ */
  const LS_TOKEN = 'cub3d_admin_token';
  const SS_TOKEN = 'cub3d_admin_sess';
  const LS_AUTO  = 'cub3d_admin_auto';
  let token = '';
  function remStore(k){ try { localStorage.removeItem(k); } catch(e){} }
  function autoLoginOn(){ try { return localStorage.getItem(LS_AUTO) === '1'; } catch(e){ return false; } }
  function setLogged(v, persist){ try { if(persist){ if(v) localStorage.setItem(LS_AUTO,'1'); else localStorage.removeItem(LS_AUTO); } } catch(e){} }
  function toast(msg){
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove('show'), 1900);
  }
  // 后端错误码 → 中文提示
  const ERR_ZH = {
    'unauthorized': '登录已失效，请重新登录',
    'invalid_credentials': '账号或密码错误',
    'bad_request': '请求格式有误，请重试',
    'old_mismatch': '当前密码不正确',
    'not_found': '资源不存在',
    'locked': '账户已锁定，请稍后再试'
  };
  function zhErr(code, fb){ return (code && ERR_ZH[code]) || fb; }

  function api(path, opts){
    if (path.indexOf('api/') === 0) path = '/admin/' + path; // 归一化绝对路径，门户与子页面一致
    opts = opts || {};
    opts.headers = opts.headers || {};
    if (token) opts.headers['X-Admin-Token'] = token;
    if (opts.body && typeof opts.body === 'object') {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(opts.body);
    }
    return fetch(path, opts).then(r => r.json().then(j => ({ status: r.status, body: j }))).then(function(res){
      if (res.status === 401 && res.body && res.body.error === 'unauthorized') {
        remStore(LS_TOKEN); remStore(LS_AUTO);
        try { sessionStorage.removeItem(SS_TOKEN); } catch(e){}
        token = ''; leaveAdmin();
        try { toast('登录已失效（密码可能已修改），请重新登录'); } catch(e){}
      }
      return res;
    });
  }

  /* ============ 登录门 ============ */
  function enterAdmin(){ $('login-gate').style.display = 'none'; $('admin-main').style.display = 'flex'; renderAutoState(); }
  function leaveAdmin(){ $('admin-main').style.display = 'none'; $('login-gate').style.display = 'flex'; $('lg-remember').checked = false; }
  function renderAutoState(){
    const wrap = $('auto-row'); if(!wrap) return;
    if(autoLoginOn()){
      wrap.innerHTML = '<div class="auto-card"><div class="auto-ico">🔐</div><div class="auto-info"><div class="t"><span class="ok-dot"></span>本设备自动登录已开启</div><div class="d">此设备访问后台将自动登录，无需再次输入管理令牌。<b>仅本机本浏览器生效。</b></div></div><div class="auto-action"><button class="btn" id="auto-cancel">取消自动登录</button></div></div>';
      $('auto-cancel').addEventListener('click', function(){ remStore(LS_AUTO); remStore(LS_TOKEN); try { sessionStorage.removeItem(SS_TOKEN); } catch(e){} toast('已取消自动登录'); renderAutoState(); });
    } else {
      wrap.innerHTML = '<div class="auto-card off"><div class="auto-ico">🔓</div><div class="auto-info"><div class="t"><span class="ok-dot"></span>自动登录未开启</div><div class="d">开启后，此设备访问后台将自动登录。<b>仅本机本浏览器生效</b>。</div></div><div class="auto-action"><button class="btn primary" id="auto-on">开启自动登录</button></div></div>';
      $('auto-on').addEventListener('click', function(){ setLogged(true,true); if(token){ try { localStorage.setItem(LS_TOKEN, token); } catch(e){} } toast('已开启自动登录'); renderAutoState(); });
    }
  }
  function doLogin(){
    const user = $('lg-user').value.trim();
    const pass = $('lg-pass').value;
    const remember = $('lg-remember').checked;
    if(!user || !pass){ $('lg-msg').textContent = '请输入账号与密码'; return; }
    api('api/portal/login', { method:'POST', body:{ user:user, pass:pass } }).then(function(r){
      if (r.body && r.body.ok) {
        token = r.body.token;
        try { sessionStorage.setItem(SS_TOKEN, token); } catch(e){}
        // 始终写入 localStorage，保证跨子页面（/admin/ → /admin/build/ 等）共享登录态
        try { localStorage.setItem(LS_TOKEN, token); } catch(e){}
        if(remember){ setLogged(true,true); }
        enterAdmin();
        $('lg-pass').value = ''; $('lg-msg').textContent = '';
        toast(remember ? '登录成功，已在本设备记住（自动登录）' : '登录成功，本次会话已记住（刷新免重输）');
      } else {
        $('lg-msg').textContent = zhErr(r.body && r.body.error, '账号或密码错误');
        $('lg-pass').value = '';
      }
    }).catch(function(){ $('lg-msg').textContent = '无法连接后端服务，请检查服务是否启动'; });
  }
  $('lg-btn').addEventListener('click', doLogin);
  $('lg-pass').addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });
  $('btn-logout').addEventListener('click', function(){
    setLogged(false, true); remStore(LS_TOKEN);
    try { sessionStorage.removeItem(SS_TOKEN); } catch(e){}
    token = ''; leaveAdmin(); toast('已退出登录（已同时取消本设备自动登录）');
  });

  /* ============ 修改密码 ============ */
  $('btn-pwd').addEventListener('click', () => { $('pm-msg').textContent=''; $('pm-old').value=''; $('pm-new').value=''; $('pm-new2').value=''; $('pwd-modal').classList.add('show'); });
  $('pm-cancel').addEventListener('click', () => $('pwd-modal').classList.remove('show'));
  $('pm-save').addEventListener('click', function(){
    const old = $('pm-old').value, nx = $('pm-new').value, nx2 = $('pm-new2').value;
    if(!old || !nx || !nx2){ $('pm-msg').textContent='请填全三项'; return; }
    if(nx.length < 6){ $('pm-msg').textContent='新密码至少 6 位'; return; }
    if(nx !== nx2){ $('pm-msg').textContent='两次新密码不一致'; return; }
    api('api/portal/passwd', { method:'POST', body:{ old:old, next:nx } }).then(function(r){
      if(r.body && r.body.ok){ $('pwd-modal').classList.remove('show'); token = r.body.token; if(token){ try{ localStorage.setItem(LS_TOKEN, token); }catch(e){} try{ sessionStorage.setItem(SS_TOKEN, token); }catch(e){} } toast('密码已修改，请牢记新密码'); }
      else $('pm-msg').textContent = zhErr(r.body && r.body.error, '修改失败');
    }).catch(function(){ $('pm-msg').textContent='无法连接后端'; });
  });

  /* ============ 初始化：自动登录 ============ */
  (function tryAutoLogin(){
    let saved = null;
    try { saved = localStorage.getItem(LS_TOKEN) || sessionStorage.getItem(SS_TOKEN); } catch(e){}
    if(!saved){ leaveAdmin(); return; }
    token = saved; enterAdmin();
    api('api/portal/auth-check').then(function(r){
      if(r.status === 401){ remStore(LS_TOKEN); try{ sessionStorage.removeItem(SS_TOKEN); }catch(e){} token=''; leaveAdmin(); }
    });
  })();
})();
</script>
</body>
</html>
