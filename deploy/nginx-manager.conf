# deploy/nginx-manager.conf — 站内 nginx 模板（仓库内，从零部署）
#
# 站点：正式域名 https://cub3d-editor.cn/ （主） ；过渡期 http://139.196.104.56/ （IP 兜底，可删）
# 云端根：__DEPLOY_ROOT__ （部署时由 deploy.sh 注入，便于迁移到正式网址/服务器）
# 管理端运行于 localhost:3000，由 BASE=/admin 感知子路径前缀。
#
# 切换流程（服务器上执行，详见 deploy/服务器部署步骤.md）：
#   1) 域名解析：cub3d-editor.cn（+ www）→ 139.196.104.56
#   2) 申请证书：sudo certbot certonly --nginx -d cub3d-editor.cn -d www.cub3d-editor.cn
#   3) 上传本文件到 /etc/nginx/conf.d/cub3d.conf 并 nginx -t && systemctl reload nginx
#
# 部署：复制到服务器 /etc/nginx/conf.d/ 并 reload。

# ---------- HTTP 80 ----------
# 正式域名：强制跳转 HTTPS（certbot --nginx 的 http-01 验证会自动处理 .well-known）
server {
    listen 80;
    listen [::]:80;
    server_name cub3d-editor.cn www.cub3d-editor.cn;
    return 301 https://$host$request_uri;
}

# 过渡期 IP（Android 明文放行的 HTTP 更新探测、旧书签直访兜底）：
# 迁移完成、确认无 IP 依赖后可整段删除。
server {
    listen 80;
    listen [::]:80;
    server_name 139.196.104.56;

    root __DEPLOY_ROOT__;
    index index.html;

    # 更新包与元数据：直接文件服务（客户端 /downloads/update-doc.json）
    location /downloads/ {
        alias __DEPLOY_ROOT__/downloads/;
        add_header Access-Control-Allow-Origin *;
        expires 1h;
    }

    # 管理端透传：BASE=/admin 由 server.mjs 读取（保留完整路径，勿加尾斜杠）
    # client_max_body_size 允许本机代理分块上传安装包（每块 8MB）
    location /admin/ {
        proxy_pass http://127.0.0.1:3000;
        client_max_body_size 16m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 站点根（宣传页 / Web 编辑器）
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------- HTTPS 443 ----------
# 正式域名主站（证书就绪后生效；http2 如需启用，nginx≥1.25.1 在 server 内加 "http2 on;"）
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cub3d-editor.cn www.cub3d-editor.cn;

    # Let's Encrypt 标准路径；若用云厂商证书，改下面两行路径
    ssl_certificate     /etc/letsencrypt/live/cub3d-editor.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cub3d-editor.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root __DEPLOY_ROOT__;
    index index.html;

    location /downloads/ {
        alias __DEPLOY_ROOT__/downloads/;
        add_header Access-Control-Allow-Origin *;
        expires 1h;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:3000;
        client_max_body_size 16m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
