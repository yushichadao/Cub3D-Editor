# deploy/nginx-manager.conf — 站内 nginx 模板（仓库内，从零部署）
#
# 站点：现在 https://139.196.104.56/ ，备案后 https://cub3d-editor.cn/
# 云端根：__DEPLOY_ROOT__ （部署时由 deploy.sh 注入，便于迁移到正式网址/服务器）
# 管理端运行于 localhost:3000，由 BASE=/admin 感知子路径前缀。
#
# 部署：复制到服务器 /etc/nginx/conf.d/ 并 reload。

server {
    listen 80;
    listen [::]:80;
    # 现在用 IP，备案后改 server_name cub3d-editor.cn;
    server_name 139.196.104.56;

    # 强制 HTTPS（证书就绪后启用，证书未就绪时仅 80 调试用）
    # return 301 https://$host$request_uri;

    root __DEPLOY_ROOT__;
    index index.html;

    # 更新包与 元数据：直接文件服务（客户端 /downloads/update-doc.json）
    location /downloads/ {
        alias __DEPLOY_ROOT__/downloads/;
        add_header Access-Control-Allow-Origin *;
        expires 1h;
    }

    # 管理端透传：BASE=/admin 由 server.mjs 读取（与本地目录名一致）
    location /admin/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 站点根（宣传页 / Web 编辑器）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
